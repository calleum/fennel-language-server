[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tempfile = "3.10.1"
clap = { version = "4.5.1", features = ["derive"] }
dashmap = "6.1.0"
ropey = "1.6.1"
serde = "1.0.197"
serde_json = "1.0.114"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "io-std", "io-util", "net", "macros"] }
tower-lsp = "0.20.0"
regex = { version = "1.10.3", default-features = false, features = ["std"] }
rowan = "0.15.15"
thiserror = "1.0.58"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# taken from https://emschwartz.me/your-clippy-config-should-be-stricter/
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
# lto = true
strip = true
# codegen-units = 1
# opt-level = 3
# panic = "abort"
